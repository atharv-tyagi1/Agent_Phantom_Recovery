apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-phantom-worker
  namespace: phantom-system
  labels:
    app: agent-phantom-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-phantom-worker
  template:
    metadata:
      labels:
        app: agent-phantom-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: agentphantom/api:latest
          command: ["python", "worker_entry.py"]
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: phantom-config
            - secretRef:
                name: phantom-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
