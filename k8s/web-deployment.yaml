apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-phantom-web
  namespace: phantom-system
  labels:
    app: agent-phantom-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-phantom-web
  template:
    metadata:
      labels:
        app: agent-phantom-web
    spec:
      containers:
        - name: web
          image: agentphantom/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.phantom.internal"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
